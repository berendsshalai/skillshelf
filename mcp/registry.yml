version: 1
servers:
  - name: github-read
    purpose: Read public or authorised GitHub source metadata without mutation.
    required_by: [find-skills-agent, skill-governor-agent]
    transport: connector
    adapter: host-provided
    authentication: user-managed
    read_tools: [repository_read, issue_read, pull_request_read]
    write_tools: []
    confirmation_required: false
    data_scope: Explicit repositories only.
    secret_environment_variables: [GH_TOKEN]
    secret_references:
      - environment: GH_TOKEN
    installation_status: optional
    validation_command: gh auth status
    fallback: Public HTTPS and local git metadata.
  - name: skill-registry-read
    purpose: Inspect configured skill registries.
    required_by: [find-skills-agent]
    transport: host
    adapter: host-provided
    authentication: none
    read_tools: [search_files]
    write_tools: []
    confirmation_required: false
    data_scope: Skill metadata only.
    secret_environment_variables: []
    installation_status: built-in
    validation_command: python scripts/validate-agents.py
    fallback: Local skill discovery.
  - name: web-read
    purpose: Read public source documentation.
    required_by: [find-skills-agent]
    transport: connector
    adapter: host-provided
    authentication: none
    read_tools: [search, open]
    write_tools: []
    confirmation_required: false
    data_scope: Public pages relevant to the delegated task.
    secret_environment_variables: []
    installation_status: optional
    validation_command: python scripts/validate-agents.py
    fallback: No-web result with explicit limitation.
  - name: github-project
    purpose: Read project GitHub state and perform approved repository writes.
    required_by: [superpowers-agent]
    transport: connector
    adapter: host-provided
    authentication: user-managed
    read_tools: [repository_read, issue_read, pull_request_read]
    write_tools: [branch_push, pull_request_create]
    confirmation_required: true
    data_scope: Current repository.
    secret_environment_variables: [GH_TOKEN]
    secret_references:
      - environment: GH_TOKEN
    installation_status: optional
    validation_command: gh auth status
    fallback: Local git only.
  - name: filesystem-project
    purpose: Bounded project file reads and approved writes.
    required_by: [superpowers-agent, design-intelligence-agent]
    transport: host
    adapter: host-provided
    authentication: sandbox
    read_tools: [read_file, search_files]
    write_tools: [apply_patch]
    confirmation_required: false
    data_scope: Current repository excluding upstream submodules.
    secret_environment_variables: []
    installation_status: built-in
    validation_command: python scripts/validate-agents.py
    fallback: Read-only operation.
  - name: skillshelf-memory
    purpose: Progressive project memory retrieval.
    required_by: [memory-agent, skill-governor-agent]
    transport: stdio
    command: node
    args: [upstream/claude-mem/plugin/scripts/mcp-server.cjs]
    cwd: .
    environment_references: []
    cache_tools: true
    startup_timeout_seconds: 15
    call_timeout_seconds: 30
    authentication: local-process
    read_tools: [search, timeline, get_observations]
    write_tools: []
    confirmation_required: false
    data_scope: Current project.
    secret_environment_variables: []
    installation_status: optional
    validation_command: pwsh scripts/doctor-memory.ps1
    fallback: Project-scoped SQLite keyword search.
  - name: browser-read
    purpose: Inspect and capture the authorised project UI.
    required_by: [design-intelligence-agent]
    transport: connector
    adapter: host-provided
    authentication: host-session
    read_tools: [open, inspect, screenshot]
    write_tools: []
    confirmation_required: false
    data_scope: Project previews and named deployments.
    secret_environment_variables: []
    installation_status: optional
    validation_command: python scripts/build-site.py
    fallback: Static checks.
  - name: image-reference-read
    purpose: Read user-provided or project image references.
    required_by: [design-intelligence-agent]
    transport: host
    adapter: host-provided
    authentication: sandbox
    read_tools: [view_image]
    write_tools: []
    confirmation_required: false
    data_scope: Explicit project and user-provided image paths.
    secret_environment_variables: []
    installation_status: built-in
    validation_command: python scripts/validate-agents.py
    fallback: Continue without unavailable image evidence.
  - name: filesystem-governance
    purpose: Write observations and staged proposals outside live skills.
    required_by: [skill-governor-agent]
    transport: host
    adapter: host-provided
    authentication: sandbox
    read_tools: [read_file, search_files]
    write_tools: [write_observation, create_staged_copy]
    confirmation_required: true
    data_scope: SkillShelf events and staged-updates directories only.
    secret_environment_variables: []
    installation_status: built-in
    validation_command: python scripts/validate-agents.py
    fallback: Read-only governance report.
  - name: github
    purpose: Inspect upstream repositories, issues, pull requests, and publish only when explicitly authorised.
    required_by: [find-skills-codex, source_audit_agent, release_agent]
    transport: connector
    adapter: host-provided
    authentication: User-managed GitHub OAuth or GitHub CLI session.
    read_tools: [repository_read, issue_read, pull_request_read]
    write_tools: [repository_create, branch_push, pull_request_create]
    confirmation_required: true
    data_scope: Repositories explicitly named by the user or this project lock.
    secret_environment_variables: [GH_TOKEN]
    secret_references:
      - environment: GH_TOKEN
    installation_status: external-connector
    validation_command: gh auth status
    fallback: Authenticated gh CLI for supported operations; local Git for repository inspection.
  - name: openaiDeveloperDocs
    purpose: Verify current Codex skills, plugins, MCP, hooks, agents, and packaging.
    required_by: [codex_migration_agent, mcp_security_agent]
    transport: streamable_http
    url: https://developers.openai.com/mcp
    header_references: {}
    cache_tools: true
    startup_timeout_seconds: 15
    call_timeout_seconds: 30
    authentication: none
    read_tools: [search_openai_docs, fetch_openai_doc]
    write_tools: []
    confirmation_required: false
    data_scope: Public OpenAI developer documentation.
    secret_environment_variables: []
    installation_status: optional
    validation_command: codex mcp get openaiDeveloperDocs
    fallback: Official Codex manual, then official OpenAI-domain web pages.
  - name: codex-memory
    purpose: Progressive project-scoped memory search, timeline retrieval, and selected observation fetch.
    required_by: [codex-memory, memory_integration_agent]
    transport: stdio
    command: node
    args: [upstream/claude-mem/plugin/scripts/mcp-server.cjs]
    cwd: .
    environment_references: []
    cache_tools: true
    startup_timeout_seconds: 15
    call_timeout_seconds: 30
    authentication: local-process
    read_tools: [search, timeline, get_observations]
    write_tools: []
    confirmation_required: false
    data_scope: Current project by default; cross-project only when explicitly requested.
    secret_environment_variables: []
    installation_status: optional-upstream-runtime
    validation_command: pwsh scripts/doctor-memory.ps1
    fallback: Project-scoped SQLite keyword search with the same progressive retrieval limits.
  - name: filesystem
    purpose: Read and modify files within the authorised repository or stable SkillShelf state root.
    required_by: [all-local-agents]
    transport: host
    adapter: host-provided
    authentication: Codex sandbox and approval policy.
    read_tools: [read_file, search_files]
    write_tools: [apply_patch]
    confirmation_required: false
    data_scope: Repository and explicitly selected SkillShelf state directories.
    secret_environment_variables: []
    installation_status: host-provided
    validation_command: python scripts/validate-package.py
    fallback: Native shell reads and apply_patch within the same scope.
  - name: browser
    purpose: Verify the local or deployed documentation site when browser QA is requested.
    required_by: [design_integration_agent, release_agent]
    transport: connector
    adapter: host-provided
    authentication: host-session
    read_tools: [open, inspect, screenshot]
    write_tools: [click, type]
    confirmation_required: false
    data_scope: SkillShelf local preview and deployed Pages site.
    secret_environment_variables: []
    installation_status: optional-host-connector
    validation_command: python scripts/build-site.py
    fallback: Static HTML metadata, link, and overflow-oriented tests.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skillshelf-agents"
version = "0.2.0"
description = "Shared Codex-native and OpenAI Agents SDK runtime for SkillShelf"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sha-Lai Berends"}]
dependencies = [
  "openai-agents==0.18.3",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "typer==0.27.0",
  "rich==15.0.0",
  "PyYAML==6.0.3",
  "platformdirs==4.5.1",
  "filelock==3.20.3",
  "httpx==0.28.1"
]

[project.optional-dependencies]
dev = ["build==1.3.0", "mypy==1.19.1", "pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.14.14", "types-PyYAML>=6.0.12"]
mcp = ["mcp>=1.25,<2"]
browser = ["playwright>=1.57,<2"]
memory = ["sqlalchemy>=2.0,<3"]

[project.scripts]
skillshelf = "skillshelf_agents.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/skillshelf_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["skillshelf_agents"]

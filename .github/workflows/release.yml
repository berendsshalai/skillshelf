name: Release package
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest build PyYAML
      - run: python scripts/validate-agent-workflow-visual.py
      - run: python scripts/validate-version.py ${{ github.ref_name }}
      - run: python scripts/validate-package.py
      - run: python -m pytest -q
      - run: python scripts/build-release.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: skillshelf-release-${{ github.ref_name }}
          path: dist/skillshelf-*/*
          if-no-files-found: error

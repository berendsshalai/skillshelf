name: Credentialed agent evaluations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-eval:
    runs-on: ubuntu-latest
    environment: credentialed-evals
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SKILLSHELF_HARD_TOKEN_LIMIT: "36000"
      SKILLSHELF_SOFT_TOKEN_LIMIT: "24000"
      SKILLSHELF_TRACE_INCLUDE_SENSITIVE: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ./sdk/python
      - name: Validate scored fixture suite
        run: python scripts/run-credentialed-evals.py --validate-only
      - name: Require credential and run bounded scored fixture suite
        run: python scripts/run-credentialed-evals.py --output credentialed-eval.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: sanitised-agent-eval
          path: credentialed-eval.json
          if-no-files-found: error

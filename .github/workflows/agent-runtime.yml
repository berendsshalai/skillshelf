name: Agent runtime
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "./sdk/python[dev,web]"
      - run: python scripts/validate-version.py
      - run: python scripts/generate-agents.py --profile runtime --check
      - run: python scripts/validate-agents.py
      - run: python scripts/evaluate-agents.py
      - run: ruff format --check sdk/python/src sdk/python/tests
      - run: ruff check sdk/python/src sdk/python/tests scripts
      - run: mypy --config-file sdk/python/pyproject.toml sdk/python/src/skillshelf_agents
      - run: python -m pytest -q sdk/python/tests --junitxml=test-results/runtime-${{ matrix.os }}-${{ matrix.python }}.xml
      - run: python scripts/run-agent-smoke-tests.py
      - run: python -m build sdk/python
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: runtime-tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results/*.xml
          if-no-files-found: error
  repository:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: python -m pip install pytest
      - run: python scripts/validate-package.py
      - run: python -m pytest -q
      - run: node --test skills/codex-memory/tests/*.test.mjs

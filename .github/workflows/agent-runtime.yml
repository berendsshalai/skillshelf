name: Agent runtime
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  sdk:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e "./sdk/python[dev]"
      - run: python scripts/generate-agents.py --check
      - run: python scripts/validate-agents.py
      - run: python scripts/evaluate-agents.py
      - run: ruff check sdk/python/src sdk/python/tests scripts/generate-agents.py scripts/validate-agents.py scripts/evaluate-agents.py scripts/run-agent-smoke-tests.py
      - run: mypy --config-file sdk/python/pyproject.toml sdk/python/src/skillshelf_agents
      - run: python -m pytest -q sdk/python/tests
      - run: python scripts/run-agent-smoke-tests.py
      - run: python -m build sdk/python
  repository:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: python -m pip install pytest
      - run: python scripts/validate-package.py
      - run: python -m pytest -q
      - run: node --test skills/codex-memory/tests/*.test.mjs
